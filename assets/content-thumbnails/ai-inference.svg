    <rect x="33" y="18" width="15" height="15" fill="none"/>
    <rect x="48" y="18" width="15" height="15" fill="none"/>
    <rect x="63" y="18" width="15" height="15" fill="none"/>
    <rect x="18" y="33" width="15" height="15" fill="rgba(136, 192, 208, 0.35)"/>
    <rect x="33" y="33" width="15" height="15" fill="rgba(136, 192, 208, 0.35)"/>
    <rect x="48" y="33" width="15" height="15" fill="none"/>
    <rect x="63" y="33" width="15" height="15" fill="none"/>
    <rect x="18" y="48" width="15" height="15" fill="rgba(136, 192, 208, 0.35)"/>
    <rect x="33" y="48" width="15" height="15" fill="rgba(136, 192, 208, 0.35)"/>
    <rect x="48" y="48" width="15" height="15" fill="rgba(136, 192, 208, 0.35)"/>
    <rect x="63" y="48" width="15" height="15" fill="none"/>
    <rect x="18" y="63" width="15" height="15" fill="rgba(136, 192, 208, 0.35)"/>
    <rect x="33" y="63" width="15" height="15" fill="rgba(136, 192, 208, 0.35)"/>
    <rect x="48" y="63" width="15" height="15" fill="rgba(136, 192, 208, 0.35)"/>
    <rect x="63" y="63" width="15" height="15" fill="rgba(136, 192, 208, 0.35)"/>
